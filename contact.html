<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/contact.css?v=2">
<title>Contact · Smart-Score</title></head><body>
<main class="contact-page"><div class="bg"></div><div class="rays"></div>
<div class="language-switcher"><span class="language-label">Language</span><details id="language"><summary aria-label="Select language"><span id="current-flag" class="flag flag-us" aria-hidden="true"></span><span id="current-language">English</span></summary><div class="language-menu"><button type="button" data-language="en"><span class="flag flag-us" aria-hidden="true"></span>English</button><button type="button" data-language="de"><span class="flag flag-de" aria-hidden="true"></span>Deutsch</button></div></details></div>
<section class="contact-card"><a id="back" class="back-link" href="index.html">← Back</a><img class="contact-logo" src="assets/images/app_logo.svg" alt="Smart-Score"><p id="eyebrow" class="form-eyebrow">GET IN TOUCH</p><h1 id="contact-title">Contact</h1><p id="intro" class="contact-intro">Have a question about Smart-Score? Send us a message.</p>
<form id="contact-form"><label><span id="name-label">Name</span><input type="text" name="user_name" autocomplete="name" required></label><label><span id="email-label">Email</span><input type="email" name="user_email" autocomplete="email" required></label><label><span id="subject-label">Subject</span><input type="text" name="subject" required></label><label><span id="message-label">Message</span><textarea name="message" rows="6" required></textarea></label><div class="recaptcha-wrap"><div class="g-recaptcha" data-sitekey="6Lcws48tAAAAAAJ3_8bTgOczfCz3sVRGKoc99b_t" data-theme="dark"></div></div><button id="submit-button" type="submit">Send message</button><p id="privacy-note" class="privacy-note">The information you enter is used to answer your request. See our <a id="privacy-link" href="privacy.html">Privacy Policy</a>.</p><p id="form-status" class="form-status" role="status" aria-live="polite"></p></form>
</section></main>
<script src="https://www.google.com/recaptcha/api.js" async defer></script><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script src="assets/js/contact.js?v=2"></script>
</body></html>
